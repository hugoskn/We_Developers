<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Dark background tile -->
  <rect width="32" height="32" rx="7" fill="#0e0e0c"/>

  <!-- Amber "W" mark made from two chevrons -->
  <!-- Left chevron -->
  <polyline points="5,10 10,22 14,14" stroke="#f0b429" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right chevron -->
